# The allowlist is the security boundary. The LLM produced the spec, the spec is
# untrusted, and every value in it must be present here before it reaches a builder.
#
# Editing this file is a security change: it needs review like code.

version: 1

# Base images are selected by identifier, never by URL. A spec cannot point the
# build at an arbitrary download; it can only name a version listed here, and the
# builder is expected to verify the checksum before using it.
base_images:
  ubuntu:
    # Pinned to a dated release directory: the `release/` alias moves on every respin and
    # would silently invalidate the checksum. Verified against the official SHA256SUMS.
    "22.04":
      url: https://cloud-images.ubuntu.com/releases/jammy/release-20261020/ubuntu-22.04-server-cloudimg-amd64.img
      sha256: 2099e63da0b822ef8e05e3d596c1b402eaaae658fc08ab919cb8495bfcdc488b
    "24.04":
      url: https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-amd64.img
      sha256: 04e8f2461a16a44e78a370284471f29616cdd9baf1893df25807b71f985b6c94

# Packages the build always installs, whether or not the spec asks for them.
# `qemu-guest-agent` is here because phase 0 proved the official cloud image does
# not ship it, and the image is not "cloud ready" without it.
mandatory_packages:
  - cloud-init
  - openssh-server
  - qemu-guest-agent

# Curated catalogue. Anything not listed is rejected: there is no escape hatch.
# A bare name comes from the Ubuntu archive. `{name, repository}` comes from the vendor
# repository of that name, declared under `repositories:` below.
packages:
  - apache2
  - build-essential
  - ca-certificates
  - certbot
  - chrony
  - cifs-utils
  - cloud-init
  - containerd
  - curl
  - docker.io
  - dnsutils
  - fail2ban
  - git
  - htop
  - jq
  - logrotate
  - mariadb-server
  - memcached
  - mysql-server
  - net-tools
  - nfs-common
  - nginx
  - nginx-extras
  - openssh-server
  - postgresql
  - postgresql-client
  - postgresql-contrib
  - prometheus-node-exporter
  - python3
  - python3-certbot-nginx
  - python3-pip
  - python3-venv
  - qemu-guest-agent
  - redis-server
  - rsync
  - supervisor
  - tmux
  - ufw
  - unattended-upgrades
  - unzip
  - vim
  - wget
  # Docker CE, from Docker's own repository. `docker.io` above is the Ubuntu build; both are
  # allowed because they behave differently and an image should name the one it wants.
  - {name: docker-ce, repository: docker-ce}
  - {name: docker-ce-cli, repository: docker-ce}
  - {name: containerd.io, repository: docker-ce}
  - {name: docker-buildx-plugin, repository: docker-ce}
  - {name: docker-compose-plugin, repository: docker-ce}
  # Node.js, from NodeSource. Ubuntu's `nodejs` is older than most images want.
  - {name: nodejs, repository: nodesource}

# Vendor apt repositories. A spec cannot name one of these: a package above is what pulls its
# repository in. Each key is pinned by sha256 and verified before apt is allowed to trust it.
repositories:
  docker-ce:
    url: https://download.docker.com/linux/ubuntu
    suite: "{codename}"
    components: [stable]
    key_url: https://download.docker.com/linux/ubuntu/gpg
    key_sha256: 1500c1f56fa9e26b9b8f42452a553675796ade0807cdce11975eb98170b3a570
  nodesource:
    url: https://deb.nodesource.com/node_22.x
    suite: nodistro
    components: [main]
    key_url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    key_sha256: b42e0321dabdc24e892115da705cf061167eac12a317f23d329862d0aa0a271d

# Snaps the spec may name. Channel, confinement and the exact revision are decided here,
# never by the model: the spec only says which snap it wants.
snaps:
  docker:
    channel: stable
    classic: true
    # Pinned exactly: `stable` is a moving pointer, so the manifest could not claim
    # what was installed. Bumping this number is a reviewed change (see backlog.md).
    revision: 3618
  certbot:
    channel: stable
    classic: true
    revision: 5911

# Services the spec may start or stop.
services:
  - chrony
  - cron
  - docker
  - fail2ban
  - nginx
  - postgresql
  - prometheus-node-exporter
  - qemu-guest-agent
  - redis-server
  - ssh
  - ufw

# Required by the verifier: it needs a guaranteed way into the guest, and the
# guest agent is part of being cloud-ready. A spec cannot disable these.
required_services:
  - ssh
  - qemu-guest-agent

# Writable path prefixes. A path is allowed only if it equals an entry or falls
# under an entry that ends with a slash. Directories holding authorisation, key or
# unit definitions are deliberately absent.
file_prefixes:
  - /etc/default/
  - /etc/logrotate.d/
  - /etc/motd
  - /etc/nginx/
  - /etc/profile.d/
  - /etc/security/limits.d/
  - /etc/sysctl.d/
  - /etc/systemd/journald.conf

# Packages that are never offered for addition from a machine, even though they exist in the
# Ubuntu archive: remote-login daemons that send credentials in clear and desktop or server
# metapackages that drag in hundreds of packages. Adding to this list is a reviewed change.
never_add:
  - kubuntu-desktop
  - lubuntu-desktop
  - rsh-redone-server
  - rsh-server
  - tftpd
  - tftpd-hpa
  - telnetd
  - ubuntu-desktop
  - ubuntu-desktop-minimal
  - ubuntu-server
  - xubuntu-desktop

# Defence in depth, not the primary control: even if a prefix above is widened by
# mistake, these paths stay unwritable.
forbidden_prefixes:
  - /etc/cron
  - /etc/ssh/
  - /etc/sudoers
  - /etc/sudoers.d/
  - /home/
  - /lib/systemd/system/
  - /root/
  - /usr/lib/systemd/system/
