[project]
name = "gira-iso"
version = "0.0.1"
description = "Turn a natural-language description into a validated, reproducible, cloud-ready qcow2 image"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jinja2>=3.1",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# Uploading to OpenStack is outside the MVP; the base install does not need it.
openstack = ["openstacksdk>=3.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gira_iso"]

[project.scripts]
gira-iso = "gira_iso.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer declares arguments and options as default values by design.
"src/gira_iso/cli.py" = ["B008"]
